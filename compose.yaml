services:
  # Apache AGE (PostgreSQL-pohjainen graafitietokanta)
  age:
    image: apache/age:latest
    container_name: pyzx-age-db
    profiles: ["age", "all"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Memgraph (In-memory graafitietokanta)
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: pyzx-memgraph-db
    profiles: ["mem", "all"]
    ports:
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgcmd || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Memgraph Lab (Käyttöliittymä Memgraphille)
  lab:
    image: memgraph/lab:latest
    profiles: ["mem", "all"]
    ports:
      - "3000:3000"
    depends_on:
      - memgraph

  # Adminer (Käyttöliittymä AGE/Postgres-tietokannalle)
  adminer:
    image: adminer:latest
    profiles: ["age", "all"]
    ports:
      - "8080:8080"
    depends_on:
      - age

  # Neo4j (Graafitietokanta)
  neo4j:
    image: neo4j:latest
    container_name: pyzx-neo4j-db
    profiles: ["neo4j", "all"]
    ports:
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neodash (Käyttöliittymä Neo4j-tietokannalle)
  neodash:
    image: neo4jlabs/neodash:latest
    profiles: ["neo4j", "all"]
    ports:
      - "5005:5005"
    depends_on:
      - neo4j
